<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Agent</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <section class="card input-card">
      <div class="input-grid">
        <div>
          <label>上传图片（最多 32 张）</label>
          <div class="batch-tray" id="batchTray">
            <div class="tray-header">
              <span class="tray-count" id="trayCount">已选择 0 / 32 张</span>
              <div class="tray-actions">
                <button type="button" id="addButton" class="link-button">+ 继续添加</button>
                <button type="button" id="clearButton" class="link-button" hidden>清空全部</button>
              </div>
            </div>
            <div class="dropzone" id="dropzone">
              <span id="dropzoneText">拖拽图片到这里 / 点击选择图片</span>
            </div>
            <div class="tray-grid" id="trayGrid" hidden></div>
          </div>
          <p class="upload-hint">支持 .jpg / .jpeg / .png / .webp / .bmp；可按住 Ctrl 或 Shift 一次多选，也可分批添加</p>
          <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.webp,.bmp" multiple hidden>
        </div>
        <div class="prompt-column">
          <label for="promptInput">任务指令</label>
          <div class="prompt-row">
            <textarea id="promptInput" rows="3" placeholder="例如：只给穿红色衣服的人描边"></textarea>
            <button type="button" id="runButton" class="primary">运行</button>
          </div>
        </div>
      </div>

      <div id="runStatus" class="run-status" data-state="idle">
        <span class="status-dot"></span><strong>就绪</strong><span>请上传图片并输入任务指令。</span>
      </div>
    </section>

    <section id="results" class="results" hidden>
      <div class="card">
        <div id="jobList"></div>
      </div>
    </section>
  </main>

  <div id="imageViewer" class="image-viewer" role="dialog" aria-modal="true" aria-label="图片预览" hidden>
    <div class="viewer-toolbar">
      <span>滚轮缩放 · 拖拽平移 · 双击复位</span>
      <button type="button" id="viewerClose" aria-label="关闭图片预览">关闭</button>
    </div>
    <div id="viewerStage" class="viewer-stage">
      <img id="viewerImage" alt="放大预览" draggable="false">
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
